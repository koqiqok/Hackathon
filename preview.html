function query(q){
 const text=q.toLowerCase(),ds=allFacts(),known=ds.filter(function(d){return text.includes(d.place.name.toLowerCase())}),pool=known.length?known:ds;
 const match=text.match(/(\d+)\s*(h(?:ours?|rs?)?\b|days?\b)/),h=match?Math.max(1,Math.min(720,Number(match[1])*(match[2].startsWith('d')?24:1))):48;
 const out={question:q,title:'',summary:'',items:[],ids:[],records:synced().length};
 function locations(arr,sub,evidence){out.ids=arr.map(function(d){return d.place.id});out.items=arr.map(function(d){const e=evidence?evidence(d):(d.confirmed||d.last);return {loc:d.place.id,label:d.place.name,sub:sub(d),eid:e?e.id:null,tone:color(d)}})}
 if(/available|free|unassigned/.test(text)&&/team/.test(text)&&!/communit|location/.test(text)){
  const available=TEAMS.filter(function(t){return !ds.some(function(d){return d.team&&d.team.id===t.id})});
  out.title=available.length+' '+(available.length===1?'team is':'teams are')+' available';
  out.summary='Based on active assignments in this demo. Availability is not a live radio check.';
  out.items=available.map(function(t){return {team:t.id,label:'Team '+t.name,sub:t.specialty+' · '+t.size+' responders'}});return out;
 }
 const requested=NEEDS.filter(function(n){return text.includes(n.toLowerCase())});
 if(requested.length&&(/need|open|outstanding|request|require|waiting|pending/.test(text)||!text.includes('evacuat'))){
  const arr=pool.filter(function(d){return requested.some(function(n){return d.needs.has(n)})}).sort(function(a,b){return priority(b)-priority(a)});
  out.title=arr.length+' '+(arr.length===1?'community has':'communities have')+' open '+requested.map(function(n){return n.toLowerCase()}).join(' / ')+' needs';
  out.summary='Requests stay open until an explicit, confirmed resolution. Relayed requests are included and labeled in their source.';
  locations(arr,function(d){return requested.filter(function(n){return d.needs.has(n)}).join(', ')+' · '+(d.team?'Team '+d.team.name:'Unassigned')},function(d){return d.needs.get(requested.find(function(n){return d.needs.has(n)}))});return out;
 }
 if(/evacuat/.test(text)){
  const es=ordered(synced().filter(function(e){return e.kind==='evacuation'&&e.verified&&pool.some(function(d){return d.place.id===e.locationId})&&(!match||age(e)<=h)}));
  out.title=es.length+' confirmed evacuation '+(es.length===1?'report':'reports');
  out.summary='An evacuation report can cover only part of a community. It does not establish that the whole location is clear.';
  out.items=es.map(function(e){return {loc:e.locationId,label:getPlace(e.locationId).name,sub:e.people+' people reported moved · '+elapsed(e),eid:e.id,tone:'#5b9481'}});out.ids=[...new Set(es.map(function(e){return e.locationId}))];return out;
 }
 if(/unassigned|no team|without a team/.test(text)){
  const arr=pool.filter(function(d){return !d.team});out.title=arr.length+' communities without an assigned team';out.summary='An assignment records intent. A confirmed field report is still needed to verify a visit.';locations(arr,function(d){return elapsed(d.confirmed)+' · '+d.needs.size+' open needs'});return out;
 }
 if(/never|unvisited|unverified|overdue|stale|haven|not |no |without|gap|unreached|not received/.test(text)&&!/latest/.test(text)){
  const never=/never/.test(text);const arr=pool.filter(function(d){return never?!d.confirmed:!recent(d,h)}).sort(function(a,b){return priority(b)-priority(a)});
  out.title=arr.length+' communities need a visit';
  const unverified=arr.filter(function(d){return !d.confirmed}).length;
  out.summary=never?unverified+' have no confirmed visit in the incident record.':(arr.length-unverified)+' overdue beyond '+h+'h; '+unverified+' never verified. Relayed reports do not confirm a visit.';
  locations(arr,function(d){return elapsed(d.confirmed)+' · '+(d.team?'Team '+d.team.name:'Unassigned')});return out;
 }
 if(known.length||/latest|report|activity|brief|summar|status|situation|need|visit|verif|coverage/.test(text)){
  let arr=pool.slice();if(/within|recent|verified in|visited in/.test(text)&&!known.length)arr=arr.filter(function(d){return recent(d,h)});
  if(/need/.test(text))arr=arr.filter(function(d){return d.needs.size});
  out.title=known.length===1?known[0].place.name+' · latest record':arr.length+' communities in the current record';
  out.summary='Latest confirmed visit and unresolved requests. Unverified updates remain available in each location’s activity history.';
  locations(arr,function(d){return elapsed(d.confirmed)+' · '+d.needs.size+' open needs'},function(d){return d.last});return out;
 }
 out.title='Ask a question the records can answer';
 out.summary='Try “No confirmed visit in 48 hours”, “Open medical needs”, “Latest evacuations”, “Available teams”, or a community name. This local demo does not interpret every phrasing.';
 return out;
}

}

 const el=document.getElementById('report-feed');if(!el)return;
 const es=ordered(state.events.filter(function(e){return reportFilter==='all'||(reportFilter==='confirmed'&&e.verified&&e.kind!=='assignment')||(reportFilter==='unverified'&&!e.verified&&e.kind!=='assignment')||(reportFilter==='queued'&&!e.synced)||(reportFilter==='assignment'&&e.kind==='assignment')}));
 el.innerHTML=es.length?es.map(function(e){return '<article class="feed-item"><div class="feed-icon '+(!e.verified?'unverified':'')+'">'+icon(e.kind==='assignment'?'team':e.kind==='evacuation'?'pin':e.kind==='assistance'?'medical':'file')+'</div><div><h3><button class="text-button" style="font-size:12px;color:var(--ink)" data-loc="'+e.locationId+'" data-eid="'+e.id+'">'+esc(getPlace(e.locationId).name)+'</button> · '+esc(KINDS[e.kind])+'</h3><div class="feed-meta"><span class="mono">'+e.id+'</span><span>'+esc(e.responder)+'</span><span>'+esc(e.mission)+'</span></div><p>'+esc(e.notes)+'</p><div class="feed-meta">Observed '+esc(date(e.observedAt))+' · Logged '+esc(date(e.recordedAt))+'</div></div><div class="feed-right">'+esc(elapsed(e))+'<br>'+badge(!e.synced?{label:'Queued locally',color:'amber'}:e.kind==='assignment'?{label:'Assignment',color:'blue'}:e.verified?{label:'Confirmed on site',color:'green'}:{label:'Unverified relay',color:'amber'})+'</div></article>'}).join(''):'<div class="empty">No events in this category.</div>';
}
function teamView(){const ds=allFacts();return '<p class="summary-note">Assignments document a planned response. A team’s assigned location remains overdue until a confirmed visit report is received.</p><section class="teams-grid">'+TEAMS.map(function(t){const places=ds.filter(function(d){return d.team&&d.team.id===t.id});return '<article class="card team-card" id="team-'+t.id+'"><div class="team-top"><span class="team-avatar">'+t.name.slice(0,2).toUpperCase()+'</span><div><h2>Team '+t.name+'</h2><p>'+esc(t.specialty)+'</p></div>'+badge({label:places.length?'Assigned':'Available',color:places.length?'blue':'green'})+'</div><p>'+t.size+' members · Lead '+esc(t.lead)+'</p><div class="team-locations">'+(places.length?places.map(function(d){return '<div style="display:flex;justify-content:space-between;gap:8px"><button class="text-button" data-loc="'+d.place.id+'">'+esc(d.place.name)+'</button>'+badge(status(d))+'</div>'}).join(''):'<span class="no-assign">No active location assignments.</span>')+'</div><button class="btn" data-team="'+t.id+'">'+icon('plus')+'Assign a location</button></article>'}).join('')+'</section>'}
function render(){
 frame();
 main.innerHTML=header()+(!storageOK?'<div class="storage-warning">Browser storage is unavailable. Changes are kept only for this session; export your records to retain them.</div>':'')+syncBanner()+(view==='overview'?kpis()+'<div class="ops-grid">'+mapPanel()+assistantPanel()+'</div>'+communityTable(false):view==='communities'?kpis()+communityTable(true):view==='reports'?reportView():teamView())+'<footer class="footnote"><span>'+icon('shield')+'Exercise data · '+INCIDENT+' · '+(storageOK?'Saved in this browser':'Session only')+'</span><button class="text-button muted" style="font-size:8px" data-action="reset">Reset demo</button><span>Verification is a record of contact, not an all-clear.</span></footer>';
 if(view==='overview'){updateMap();renderAnswer();bindMap()}
 updateTable();renderFeed();
}
function openPlace(id,eid){
 const d=facts(id),s=status(d),local=ordered(state.events.filter(function(e){return e.locationId===id}));
 showDialog(dialogHead(d.place.name,d.place.zone+' · '+id+' · '+INCIDENT)+'<div class="drawer-summary"><div class="coverage-alert '+(recent(d,state.threshold)?'ok':'')+'">'+icon('clock')+' '+(!d.confirmed?'No confirmed visit in the incident record.':recent(d,state.threshold)?'Confirmed visit '+elapsed(d.confirmed)+'.':'Last confirmed visit '+elapsed(d.confirmed)+' · revisit overdue.')+'</div><dl class="detail-stats"><div><dt>Response status</dt><dd>'+badge(s)+'</dd></div><div><dt>Planning population · demo</dt><dd>'+d.place.pop+' residents</dd></div><div><dt>Last verified contact</dt><dd>'+(d.confirmed?esc(date(d.confirmed.observedAt)):'Never verified')+'</dd></div><div><dt>Assigned team</dt><dd>'+(d.team?'Team '+esc(d.team.name):'Unassigned')+'</dd></div></dl><div class="inline-actions"><button class="btn primary" data-action="report" data-place="'+id+'">'+icon('plus')+'Field report</button><button class="btn" data-assign="'+id+'">'+icon('team')+'Assign team</button></div></div><div class="detail-needs"><h3>Open needs · '+d.needs.size+'</h3><div class="need-tags">'+(d.needs.size?[...d.needs.entries()].map(function(pair){return '<span class="need-tag '+(pair[0]==='Medical'?'medical':'')+'">'+pair[0]+(!pair[1].verified?' · unverified':'')+'</span>'}).join(''):'<span class="small muted">No unresolved requests recorded.</span>')+'</div><p class="small muted" style="font-size:9px;margin-top:10px">Only an explicit, confirmed resolution closes a need.</p></div><div class="timeline"><h3 class="timeline-title">Activity history <span class="muted">('+local.length+' events)</span></h3>'+local.map(function(e){return '<article class="timeline-item '+(!e.verified?'unverified ':'')+(eid===e.id?'focused':'')+'" id="event-'+e.id+'"><div class="mono">'+esc(e.id)+' · '+esc(date(e.observedAt))+'</div><h4>'+esc(KINDS[e.kind])+'</h4>'+badge(!e.synced?{label:'Queued locally · excluded from central view',color:'amber'}:e.kind==='assignment'?{label:'Assignment · visit not confirmed',color:'blue'}:e.verified?{label:'Confirmed on site',color:'green'}:{label:'Unverified relay',color:'amber'})+'<p>'+esc(e.notes)+'</p><div class="timeline-meta">'+esc(e.outcome)+(e.people?' · '+e.people+' people reported in this event':'')+'<br>'+esc(e.responder)+(getTeam(e.teamId)?' · Team '+esc(getTeam(e.teamId).name):'')+'<br>Observed: '+esc(date(e.observedAt))+'<br>Logged: '+esc(date(e.recordedAt))+' · '+esc(e.mission)+(e.needsAdd.length?'<br>Needs added: '+esc(e.needsAdd.join(', ')):'')+(e.needsResolve.length?'<br>Needs resolved: '+esc(e.needsResolve.join(', ')):'')+'</div></article>'}).join('')+'<div class="small muted" style="font-size:9px">History is ordered by observation time. Late reports retain their original time.</div></div>',true);
 if(eid){const e=document.getElementById('event-'+eid);if(e)e.scrollIntoView({block:'center'})}
}
function locationOptions(selected){return PLACES.map(function(p){return '<option value="'+p.id+'" '+(p.id===selected?'selected':'')+'>'+esc(p.name)+'</option>'}).join('')}
function teamOptions(selected,none){return (none?'<option value="">Unassigned</option>':'<option value="" disabled '+(!selected?'selected':'')+'>Select a team</option>')+TEAMS.map(function(t){const n=allFacts().filter(function(d){return d.team&&d.team.id===t.id}).length;return '<option value="'+t.id+'" '+(selected===t.id?'selected':'')+'>Team '+t.name+' · '+(n?n+' active location'+(n>1?'s':''):'available')+'</option>'}).join('')}
function reportForm(place){
 const d=place?facts(place):null;
 showDialog(dialogHead('New field report','Record what happened, where, when, and who verified it.')+'<form id="report-form"><div class="dialog-body"><div class="form-grid"><div class="form-field"><label for="r-location">Community *</label><select id="r-location" name="location" required><option value="" disabled '+(!place?'selected':'')+'>Select a community</option>'+locationOptions(place)+'</select></div><div class="form-field"><label for="r-type">Action taken *</label><select id="r-type" name="kind"><option value="visit">Site visit</option><option value="assessment">Needs assessment</option><option value="assistance">Aid delivered</option><option value="evacuation">Evacuation</option></select></div><div class="form-field"><label for="r-team">Reporting team *</label><select id="r-team" name="team" required>'+teamOptions(d&&d.team?d.team.id:null,false)+'</select></div><div class="form-field"><label for="r-responder">Responder name *</label><input id="r-responder" name="responder" required maxlength="70" placeholder="Name or callsign"></div><div class="form-field"><label for="r-time">Observed at (UTC) *</label><input id="r-time" type="datetime-local" name="observed" required value="'+new Date().toISOString().slice(0,16)+'"><span class="hint">Use observation time, even if reporting later.</span></div><div class="form-field"><label for="r-verification">Verification *</label><select id="r-verification" name="verification"><option value="confirmed">Confirmed firsthand on site</option><option value="unverified">Unverified / relayed report</option></select><span class="hint">Relayed reports do not verify a visit.</span></div><div class="form-field full"><label for="r-outcome">Outcome *</label><input id="r-outcome" name="outcome" required maxlength="140" placeholder="e.g. Water delivered; medication still needed"></div><div class="form-field"><label for="r-count">People involved in this event</label><input id="r-count" name="people" type="number" min="0" max="100000" step="1" value="0"><span class="hint">Event count; may overlap with other reports.</span></div><div class="form-field"><label for="r-mission">Mission</label><input id="r-mission" value="'+INCIDENT+'" readonly></div><fieldset class="form-field full" style="border:0;padding:0;margin:0"><legend class="field-label" style="margin-bottom:7px">New / still open needs</legend><div class="check-group">'+NEEDS.map(function(n){return '<label class="check-pill"><input type="checkbox" name="needsAdd" value="'+n+'">'+n+'</label>'}).join('')+'</div></fieldset><fieldset class="form-field full" id="resolve-fieldset" style="border:0;padding:0;margin:0"><legend class="field-label" style="margin-bottom:7px">Resolved in this visit</legend><div class="check-group">'+NEEDS.map(function(n){return '<label class="check-pill"><input type="checkbox" name="needsResolve" value="'+n+'">'+n+'</label>'}).join('')+'</div><span class="hint">Requires firsthand confirmation. Unchecked needs stay open.</span></fieldset><div class="form-field full"><label for="r-notes">Field notes *</label><textarea id="r-notes" name="notes" required minlength="8" maxlength="1500" placeholder="What did your team observe or do? Include remaining gaps."></textarea></div></div><p class="form-alert" id="form-error" role="alert"></p><p class="small muted" style="font-size:10px">'+(state.online?'This adds a timestamped event to the local demo record.':'You are offline. This report will queue on this device until simulated sync.')+'</p></div><div class="dialog-actions"><button class="btn" type="button" data-action="close">Cancel</button><button class="btn primary" type="submit">'+icon('check')+(state.online?'Save field report':'Queue report offline')+'</button></div></form>',false);
 if(d&&d.team)document.getElementById('r-responder').value=d.team.lead;
}
function newId(prefix){let id;do{id=prefix+'-'+Math.random().toString(16).slice(2,8).toUpperCase()}while(state.events.some(function(e){return e.id===id}));return id}
function submitReport(form){
 const f=new FormData(form),when=Date.parse(String(f.get('observed'))+'Z'),verified=f.get('verification')==='confirmed',add=f.getAll('needsAdd'),resolve=f.getAll('needsResolve'),error=document.getElementById('form-error');
 let message='';
 if(!getPlace(f.get('location'))||!getTeam(f.get('team')))message='Select a community and reporting team.';
 else if(!Number.isFinite(when)||when>Date.now()+60000)message='Observation time must be a valid time at or before the current UTC time.';
 else if(!String(f.get('responder')).trim()||!String(f.get('outcome')).trim()||String(f.get('notes')).trim().length<8)message='Add a responder, outcome, and at least eight characters of field notes.';
 else if(add.some(function(n){return resolve.includes(n)}))message='A need cannot be both open and resolved in the same report.';
 else if(resolve.length&&!verified)message='Only a confirmed firsthand report can resolve a need.';
 if(message){error.textContent=message;return}
 const event={id:newId('FR'),locationId:String(f.get('location')),kind:String(f.get('kind')),teamId:String(f.get('team')),responder:String(f.get('responder')).trim(),mission:INCIDENT,observedAt:when,recordedAt:Date.now(),verified:verified,needsAdd:add,needsResolve:resolve,notes:String(f.get('notes')).trim(),outcome:String(f.get('outcome')).trim(),people:Number(f.get('people')||0),synced:state.online};
 state.events.push(event);save();closeDialog();render();toast(state.online?'Report '+event.id+' saved to the local record.':'Report '+event.id+' queued on this device.');openPlace(event.locationId,event.id);
}
function assignForm(place,team){
 const d=place?facts(place):null;
 showDialog(dialogHead('Assign a response team','A mission assignment does not establish a confirmed visit.')+'<form id="assign-form"><div class="dialog-body"><div class="form-grid"><div class="form-field full"><label for="a-location">Community *</label><select id="a-location" name="location" required><option value="" disabled '+(!place?'selected':'')+'>Select a community</option>'+locationOptions(place)+'</select></div><div class="form-field full"><label for="a-team">Assigned team</label><select id="a-team" name="team">'+teamOptions(team||(d&&d.team?d.team.id:null),true)+'</select><span class="hint">Choose Unassigned to release this location’s team.</span></div><div class="form-field full"><label for="a-notes">Mission instructions *</label><textarea id="a-notes" name="notes" required minlength="5" maxlength="800" placeholder="Describe the follow-up action and any known needs."></textarea></div></div><p id="form-error" class="form-alert" role="alert"></p><p class="small muted" style="font-size:10px">Local exercise assignment. No message is sent to a field team.</p></div><div class="dialog-actions"><button type="button" class="btn" data-action="close">Cancel</button><button type="submit" class="btn primary">'+icon('check')+(state.online?'Save assignment':'Queue assignment')+'</button></div></form>',false);
}
function submitAssignment(form){
 const f=new FormData(form),loc=String(f.get('location')),team=String(f.get('team')||''),notes=String(f.get('notes')||'').trim();
 if(!getPlace(loc)||notes.length<5){document.getElementById('form-error').textContent='Select a community and enter mission instructions.';return}
 state.events.push({id:newId('AS'),locationId:loc,kind:'assignment',teamId:team||null,responder:'Operations coordinator',mission:INCIDENT,observedAt:Date.now(),recordedAt:Date.now(),verified:false,needsAdd:[],needsResolve:[],notes:notes,outcome:team?'Team '+getTeam(team).name+' assigned':'Assignment released',people:0,synced:state.online});save();closeDialog();render();toast(state.online?'Assignment saved in the local demo.':'Assignment queued until simulated sync.');
}
function alerts(){
 const ds=allFacts().filter(function(d){return !recent(d,state.threshold)}).sort(function(a,b){return priority(b)-priority(a)});
 showDialog(dialogHead('Coverage alerts',state.threshold+'h revisit threshold · '+ds.length+' communities need confirmation')+'<div class="dialog-body">'+(ds.length?ds.map(function(d){return '<button class="alert-item" data-loc="'+d.place.id+'"><strong>'+esc(d.place.name)+badge(status(d))+'</strong><p>'+(d.confirmed?'Last confirmed '+elapsed(d.confirmed):'No confirmed visit recorded')+' · '+d.needs.size+' open needs</p><p>'+(d.team?'Assigned to Team '+d.team.name+'; visit still needs confirmation.':'No team currently assigned.')+'</p></button>'}).join(''):'<div class="empty">All communities have a recent confirmed visit.</div>')+'<p class="small muted" style="font-size:10px">Coverage alerts are derived from synced records. Unverified and queued reports do not refresh the visit clock.</p></div>',false);
}
function exportDialog(){showDialog(dialogHead('Export operational records','Download a snapshot of this exercise, including its sources.')+'<div class="dialog-body"><button class="export-option" data-export="json">'+icon('file')+'<div><strong>Complete event log</strong><span>JSON · includes source times, mission, verification, and queued events</span></div></button><button class="export-option" data-export="csv">'+icon('grid')+'<div><strong>Community status summary</strong><span>CSV · current synced status, open needs, and assigned teams</span></div></button><p class="small muted" style="font-size:10px">Snapshot generated '+esc(date(Date.now()))+'. All data is fictional exercise data.</p></div>',false)}
function csvCell(s){let v=String(s==null?'':s);if(/^[=+@-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function exportData(type){
 let data,mime,filename;
 if(type==='json'){data=JSON.stringify({app:'Relay local exercise',incident:INCIDENT,exportedAt:new Date().toISOString(),revisitThresholdHours:state.threshold,communities:PLACES,teams:TEAMS,events:state.events},null,2);mime='application/json';filename='Relay-event-log.json'}
 else{const rows=[['Community','Sector','Status','Last confirmed UTC','Source record','Open needs','Team','Last report verification']].concat(allFacts().map(function(d){return [d.place.name,d.place.zone,status(d).label,d.confirmed?new Date(d.confirmed.observedAt).toISOString():'Never',d.confirmed?d.confirmed.id:'',[...d.needs.keys()].join('; '),d.team?d.team.name:'Unassigned',d.last?(d.last.verified?'Confirmed':'Unverified'):'No record']}));data='\uFEFF'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');mime='text/csv;charset=utf-8';filename='Relay-community-summary.csv'}
 const url=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},10000);closeDialog();toast(filename+' exported.');
}
function resetDialog(){showDialog(dialogHead('Reset this exercise?','This clears your added local reports and assignments.')+'<div class="dialog-body"><p class="small muted">Export the event log first if you want to retain your work. The original fictional incident data will be restored.</p></div><div class="dialog-actions"><button class="btn" data-action="close">Keep working</button><button class="btn primary" data-action="confirm-reset">Reset demo</button></div>',false)}
function bindMap(){
 const el=document.getElementById('map-stage');let drag=null,moved=false;
 el.addEventListener('pointerdown',function(e){if(e.button!==0||e.target.closest('button')||e.target.closest('[data-loc]'))return;drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};moved=false;el.setPointerCapture(e.pointerId)});
 el.addEventListener('pointermove',function(e){if(!drag)return;const w=el.getBoundingClientRect().width;pan={x:Math.max(-450,Math.min(450,drag.px+(e.clientX-drag.x)*900/w)),y:Math.max(-265,Math.min(265,drag.py+(e.clientY-drag.y)*900/w))};moved=true;updateMap()});
 el.addEventListener('pointerup',function(){drag=null});el.addEventListener('pointercancel',function(){drag=null});
}
document.addEventListener('click',function(e){
 const b=e.target.closest('button,[data-loc][role="button"]');if(!b)return;
 if(b.dataset.view){view=b.dataset.view;render();return}
 if(b.dataset.loc){openPlace(b.dataset.loc,b.dataset.eid);return}
 if(b.dataset.assign){assignForm(b.dataset.assign);return}
 if(b.dataset.team){assignForm(null,b.dataset.team);return}
 if(b.dataset.query){queryText=b.dataset.query;renderAnswer();return}
 if(b.dataset.mapFilter){mapFilter=b.dataset.mapFilter;updateMap();return}
 if(b.dataset.reportFilter){reportFilter=b.dataset.reportFilter;render();return}
 if(b.dataset.export){exportData(b.dataset.export);return}
 const a=b.dataset.action;
 if(a==='report')reportForm(b.dataset.place);
 else if(a==='close')closeDialog();
 else if(a==='alerts')alerts();
 else if(a==='export')exportDialog();
 else if(a==='all-communities'){view='communities';render()}
 else if(a==='show-query-map'){mapHighlight=queryResult.ids.slice();mapFilter='all';view='overview';render();document.getElementById('map-stage').scrollIntoView({behavior:'smooth',block:'center'})}
 else if(a==='clear-highlight'){mapHighlight=null;updateMap()}
 else if(a==='zoom-in'){zoom=Math.min(2.5,zoom+.25);updateMap()}
 else if(a==='zoom-out'){zoom=Math.max(.75,zoom-.25);updateMap()}
 else if(a==='fit-map'){zoom=1;pan={x:0,y:0};updateMap()}
 else if(a==='sync'){if(!state.online)return;const n=queue().length;state.events.forEach(function(e){e.synced=true});save();render();toast(n+' queued '+(n===1?'event added':'events added')+' to the demo record.')}
 else if(a==='reset')resetDialog();
 else if(a==='confirm-reset'){state=seed();mapHighlight=null;tableFilter='all';mapFilter='all';search='';save();closeDialog();render();toast('Exercise restored to the original demo data.')}
});
document.getElementById('network').addEventListener('click',function(){state.online=!state.online;save();render();toast(state.online?'Demo reconnected. Use Sync demo queue to apply pending events.':'Offline simulation enabled. New events will queue locally.')});
document.addEventListener('input',function(e){if(e.target.id==='community-search'){search=e.target.value;updateTable()}});
document.addEventListener('change',function(e){
 if(e.target.id==='threshold'){state.threshold=Number(e.target.value);save();render()}
 if(e.target.id==='table-filter'){tableFilter=e.target.value;updateTable()}
 if(e.target.id==='r-team'){const t=getTeam(e.target.value);if(t)document.getElementById('r-responder').value=t.lead}
 if(e.target.id==='r-verification'){const fs=document.getElementById('resolve-fieldset'),off=e.target.value!=='confirmed';fs.disabled=off;if(off)fs.querySelectorAll('input').forEach(function(i){i.checked=false})}
});
document.addEventListener('submit',function(e){
 if(e.target.id==='query-form'){e.preventDefault();const input=document.getElementById('query-input');if(input.value.trim()){queryText=input.value.trim();renderAnswer();input.value=''}}
 if(e.target.id==='report-form'){e.preventDefault();submitReport(e.target)}
 if(e.target.id==='assign-form'){e.preventDefault();submitAssignment(e.target)}
});
document.addEventListener('keydown',function(e){const marker=e.target.closest('.map-marker');if(marker&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openPlace(marker.dataset.loc)}});
dialog.addEventListener('click',function(e){if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
window.addEventListener('storage',function(e){if(e.key===KEY&&e.newValue){try{const next=JSON.parse(e.newValue);if(next.version===1&&Array.isArray(next.events)){state=next;if(!dialog.open)render()}}catch(err){}}});
save();render();
setInterval(function(){
 frame();
 const metrics=main.querySelector('.kpis');
 if(metrics)metrics.outerHTML=kpis();
 if(!dialog.open){
  const list=document.querySelector('.answer-results'),top=list?list.scrollTop:0;
  updateMap();updateTable();renderFeed();renderAnswer();
  const next=document.querySelector('.answer-results');if(next)next.scrollTop=top;
 }
},60000);
</script>
</body>
